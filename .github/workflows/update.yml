name: Update Treasure Coast Today — Incremental Generation v1.9.4.1

run-name: "TCT update v1.9.4.1 • ${{ github.ref_name }} • ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    name: Update site — incremental generation v1.9.4.1 (90-minute safety ceiling)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      committed: ${{ steps.push.outputs.committed }}

    steps:
      - name: Runtime safety revision
        run: |
          echo "ACTIVE_WORKFLOW=tct-incremental-generation-v1.9.4.1"
          echo "JOB_TIMEOUT_MINUTES=90"
          echo "GITHUB_SHA=$GITHUB_SHA"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore persistent generation cache
        uses: actions/cache@v4
        with:
          path: data/generation-cache.json
          key: tct-generation-cache-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            tct-generation-cache-v1-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser anthropic requests json-repair pytest

      - name: Validate editorial package
        run: python scripts/validate_package.py

      - name: Run editorial engine tests
        run: |
          python -m pytest tests -v \
            --ignore=tests/test_canonical_identity.py \
            --ignore=tests/test_matcher_contract.py

      - name: Clean up duplicate archives
        run: |
          /usr/bin/time -f "Cleanup elapsed: %E" python cleanup_archive.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate news
        run: |
          /usr/bin/time -f "Generate elapsed: %E" python -u scripts/generate.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Repository variables provide an immediate, no-code rollout control.
          # Missing or invalid values always fall back to shadow mode.
          TCT_ENGINE_MODE: ${{ vars.TCT_ENGINE_MODE || 'shadow' }}
          TCT_ENGINE_MAX_ACTIONS: ${{ vars.TCT_ENGINE_MAX_ACTIONS || '8' }}
          TCT_ENGINE_KILL_SWITCH: ${{ vars.TCT_ENGINE_KILL_SWITCH || 'false' }}

      - name: Commit and push
        id: push
        run: |
          git config user.name "TCT Bot"
          git config user.email "bot@treasurecoast.today"
          git add -A
          git diff --staged --quiet || git commit -m "Update: $(date -u '+%b %d %Y %H:%M UTC')"
          git pull --rebase
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy attempt 1
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 1
        if: steps.d1.outcome == 'failure'
        run: sleep 45

      - name: Deploy attempt 2
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 2
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 90

      - name: Deploy attempt 3
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
