name: Update Treasure Coast Today

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser anthropic requests json-repair

      - name: Generate news
        run: python scripts/generate.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.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 }}

      - name: Commit and push
        run: |
          git config user.name "TCT Bot"
          git config user.email "bot@treasurecoast.today"
          git add -A
          git diff --staged --quiet || git commit -m "Update: $(date -u '+%b %d %Y %H:%M UTC')"
          git pull --rebase
          git push
