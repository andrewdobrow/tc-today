name: Update Treasure Coast Today — Bounded Runtime v1.9.6

run-name: "TCT update v1.9.6 • ${{ github.ref_name }} • ${{ github.sha }}"

on:
  workflow_dispatch:
    inputs:
      model_bakeoff:
        description: "Run Sonnet 5 shadow model bake-off"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    name: Update site — bounded runtime v1.9.6 (90-minute safety ceiling)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TCT_ARTICLE_BANNER_MODE: ${{ vars.TCT_ARTICLE_BANNER_MODE || 'reader_support' }}
    outputs:
      committed: ${{ steps.push.outputs.committed }}

    steps:
      - name: Runtime safety revision
        run: |
          echo "ACTIVE_WORKFLOW=tct-bounded-runtime-v1.9.6"
          echo "JOB_TIMEOUT_MINUTES=90"
          echo "GITHUB_SHA=$GITHUB_SHA"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore persistent generation cache
        id: generation-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: data/generation-cache.json
          key: tct-generation-cache-v2-source-focus-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            tct-generation-cache-v2-source-focus-${{ github.ref_name }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser anthropic requests json-repair pytest

      - name: Sanitize persistent generation cache
        run: python scripts/sanitize_generation_cache.py

      - name: Verify generator runtime guard is baked in
        run: python scripts/apply_generator_runtime_hotfix.py --check

      - name: Verify false-jurisdiction source guard is baked in
        run: python scripts/apply_false_jurisdiction_hotfix.py --check

      - name: Retire false-jurisdiction publication
        run: python scripts/repair_false_jurisdiction_publication.py

      - name: Normalize recent reader-support banners
        env:
          TCT_MEMBERSHIP_UI_ENABLED: ${{ vars.TCT_MEMBERSHIP_UI_ENABLED || 'false' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.generate import _migrate_legacy_article_support_banners

          result = _migrate_legacy_article_support_banners(Path.cwd(), limit=50)
          print(
              "Reader-support preflight: "
              f"{result['checked']} checked, {result['migrated']} migrated"
          )
          PY

      - name: Normalize persistent story registry
        run: python scripts/repair_editorial_story_registry.py

      - name: Bound persistent editorial audit history
        run: python scripts/compact_editorial_audit.py

      - name: Validate editorial package
        run: python scripts/validate_package.py

      - name: Run editorial engine tests
        run: |
          python -m pytest tests -v \
            --ignore=tests/test_canonical_identity.py \
            --ignore=tests/test_matcher_contract.py

      - name: Clean up duplicate archives
        run: |
          /usr/bin/time -f "Cleanup elapsed: %E" python cleanup_archive.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate news
        run: |
          /usr/bin/time -f "Generate elapsed: %E" python -u scripts/generate.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Repository variables provide an immediate, no-code rollout control.
          # Missing or invalid values always fall back to shadow mode.
          TCT_ENGINE_MODE: ${{ vars.TCT_ENGINE_MODE || 'shadow' }}
          TCT_ENGINE_MAX_ACTIONS: ${{ vars.TCT_ENGINE_MAX_ACTIONS || '8' }}
          TCT_ENGINE_KILL_SWITCH: ${{ vars.TCT_ENGINE_KILL_SWITCH || 'false' }}
          # Membership UI is dark-launched. It stays false unless explicitly enabled
          # after live checkout, entitlement, sign-in and account-management validation.
          TCT_MEMBERSHIP_UI_ENABLED: ${{ vars.TCT_MEMBERSHIP_UI_ENABLED || 'false' }}
          TCT_SUBSCRIBE_URL: ${{ vars.TCT_SUBSCRIBE_URL || '/subscribe.html' }}
          # Reader support appears on every article by default. Change this repository
          # variable to paid_advertising when commercial banners return; sensitive-topic
          # notices and community resources will reactivate automatically.
          TCT_ARTICLE_BANNER_MODE: ${{ vars.TCT_ARTICLE_BANNER_MODE || 'reader_support' }}
          # Manual-only, publication-isolated model evaluation. Routine runs stay off.
          TCT_MODEL_BAKEOFF: ${{ inputs.model_bakeoff }}
          # Production newsroom role separation: Sonnet 5 assigns exact stories/angles;
          # Sonnet 4.5 writes only those assignments. Set the repository variable false
          # only for emergency rollback to the legacy mixed selector/writer call.
          TCT_ASSIGNMENT_EDITOR_LIVE: ${{ vars.TCT_ASSIGNMENT_EDITOR_LIVE || 'true' }}

      - name: Save generation cache even when generation fails
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/generation-cache.json
          key: tct-generation-cache-v2-source-focus-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload model bake-off review
        if: ${{ inputs.model_bakeoff == true }}
        uses: actions/upload-artifact@v4
        with:
          name: tct-model-bakeoff-${{ github.run_id }}
          path: |
            data/model-bakeoff-report.json
            data/model-bakeoff-review.md
            data/model-bakeoff-answer-key.json
            data/model-usage-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build dark-launch membership browser config
        env:
          TCT_SUPABASE_URL: ${{ vars.TCT_SUPABASE_URL || '' }}
          TCT_SUPABASE_PUBLISHABLE_KEY: ${{ vars.TCT_SUPABASE_PUBLISHABLE_KEY || '' }}
          TCT_MEMBERSHIP_UI_ENABLED: ${{ vars.TCT_MEMBERSHIP_UI_ENABLED || 'false' }}
          TCT_STRIPE_MODE: ${{ vars.TCT_STRIPE_MODE || 'test' }}
        run: python scripts/write_membership_browser_config.py

      - name: Probe protected-content snapshot capability
        id: protected_sync_probe
        env:
          TCT_SUPABASE_URL: ${{ vars.TCT_SUPABASE_URL || '' }}
          TCT_CONTENT_SYNC_SECRET: ${{ secrets.TCT_CONTENT_SYNC_SECRET }}
          TCT_MEMBERSHIP_UI_ENABLED: ${{ vars.TCT_MEMBERSHIP_UI_ENABLED || 'false' }}
        run: |
          if [ "$TCT_MEMBERSHIP_UI_ENABLED" != "true" ]; then
            echo "needs_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          import sys
          import requests

          base = os.environ.get("TCT_SUPABASE_URL", "").strip().rstrip("/")
          secret = os.environ.get("TCT_CONTENT_SYNC_SECRET", "").strip()
          if not base or not secret:
              raise SystemExit("Membership is enabled but protected-content sync configuration is missing.")
          response = requests.post(
              f"{base}/functions/v1/sync-protected-articles",
              headers={"X-TCT-Content-Sync": secret, "Content-Type": "application/json"},
              json={"action": "snapshot", "offset": 0, "limit": 1},
              timeout=30,
          )
          output = os.environ["GITHUB_OUTPUT"]
          if response.status_code < 300:
              print("Protected-content snapshot capability is current.")
              with open(output, "a", encoding="utf-8") as handle:
                  handle.write("needs_deploy=false\n")
              raise SystemExit(0)
          if response.status_code == 400 and "Batch must contain 1-100 articles" in response.text:
              print("Legacy sync-protected-articles function detected; current function will be deployed automatically.")
              with open(output, "a", encoding="utf-8") as handle:
                  handle.write("needs_deploy=true\n")
              raise SystemExit(0)
          raise SystemExit(f"Protected-content capability probe failed with HTTP {response.status_code}.")
          PY

      - name: Probe monthly free-article meter capability
        id: protected_article_meter_probe
        env:
          TCT_SUPABASE_URL: ${{ vars.TCT_SUPABASE_URL || '' }}
          TCT_SUPABASE_PUBLISHABLE_KEY: ${{ vars.TCT_SUPABASE_PUBLISHABLE_KEY || '' }}
          TCT_MEMBERSHIP_UI_ENABLED: ${{ vars.TCT_MEMBERSHIP_UI_ENABLED || 'false' }}
        run: |
          if [ "$TCT_MEMBERSHIP_UI_ENABLED" != "true" ]; then
            echo "needs_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          import requests

          base = os.environ.get("TCT_SUPABASE_URL", "").strip().rstrip("/")
          key = os.environ.get("TCT_SUPABASE_PUBLISHABLE_KEY", "").strip()
          if not base or not key:
              raise SystemExit("Membership is enabled but monthly-meter browser configuration is missing.")
          response = requests.post(
              f"{base}/functions/v1/protected-article",
              headers={"apikey": key, "Authorization": f"Bearer {key}", "Content-Type": "application/json"},
              json={"action": "meter-capability"},
              timeout=30,
          )
          output = os.environ["GITHUB_OUTPUT"]
          if response.status_code < 300:
              payload = response.json()
              if payload.get("meter_policy") != "one_free_article_per_month":
                  raise SystemExit("Protected-article function responded but does not advertise the required monthly meter.")
              print("Monthly free-article meter capability is current.")
              with open(output, "a", encoding="utf-8") as handle:
                  handle.write("needs_deploy=false\n")
              raise SystemExit(0)
          if response.status_code in {400, 401, 404}:
              print("Legacy protected-article function detected; metered function will be deployed automatically.")
              with open(output, "a", encoding="utf-8") as handle:
                  handle.write("needs_deploy=true\n")
              raise SystemExit(0)
          raise SystemExit(f"Monthly meter capability probe failed with HTTP {response.status_code}.")
          PY

      - name: Set up Supabase CLI for protected-content repair
        if: ${{ steps.protected_sync_probe.outputs.needs_deploy == 'true' || steps.protected_article_meter_probe.outputs.needs_deploy == 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Repair stale protected-content sync function
        if: steps.protected_sync_probe.outputs.needs_deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$PROJECT_ID" || { echo "Missing GitHub repository variable SUPABASE_PROJECT_REF"; exit 1; }
          supabase functions deploy sync-protected-articles --use-api --project-ref "$PROJECT_ID"

      - name: Deploy monthly free-article protected endpoint
        if: steps.protected_article_meter_probe.outputs.needs_deploy == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing GitHub secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$PROJECT_ID" || { echo "Missing GitHub repository variable SUPABASE_PROJECT_REF"; exit 1; }
          supabase functions deploy protected-article --use-api --project-ref "$PROJECT_ID"

      - name: Snapshot current protected article store
        env:
          TCT_SUPABASE_URL: ${{ vars.TCT_SUPABASE_URL || '' }}
          TCT_CONTENT_SYNC_SECRET: ${{ secrets.TCT_CONTENT_SYNC_SECRET }}
          TCT_MEMBERSHIP_UI_ENABLED: ${{ vars.TCT_MEMBERSHIP_UI_ENABLED || 'false' }}
        run: |
          if [ "$TCT_MEMBERSHIP_UI_ENABLED" = "true" ]; then
            python scripts/sync_protected_articles.py --snapshot-file /tmp/tct-protected-current.json --required
          fi

      - name: Prepare member-only article payload
        env:
          TCT_MEMBERSHIP_UI_ENABLED: ${{ vars.TCT_MEMBERSHIP_UI_ENABLED || 'false' }}
          TCT_PROTECTED_EXPORT_PATH: /tmp/tct-protected-articles.json
          TCT_PROTECTED_SNAPSHOT_PATH: /tmp/tct-protected-current.json
        run: python scripts/prepare_membership_paywall.py

      - name: Sync protected article store
        env:
          TCT_SUPABASE_URL: ${{ vars.TCT_SUPABASE_URL || '' }}
          TCT_CONTENT_SYNC_SECRET: ${{ secrets.TCT_CONTENT_SYNC_SECRET }}
          TCT_MEMBERSHIP_UI_ENABLED: ${{ vars.TCT_MEMBERSHIP_UI_ENABLED || 'false' }}
        run: |
          if [ "$TCT_MEMBERSHIP_UI_ENABLED" = "true" ]; then
            python scripts/sync_protected_articles.py --export-file /tmp/tct-protected-articles.json --required
          else
            python scripts/sync_protected_articles.py --scan-public
          fi

      - name: Upload generation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tct-generation-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            data/persistent-story-identity-integrity.json
            data/cross-source-update-identity.json
            data/event-identity-authority.json
            data/editorial_story_registry.json
            data/forward-publication-identity.json
            data/story-regression-report.json
            archive.json

      - name: Remove transient Python artifacts
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf .pytest_cache

      - name: Guard generated repository size
        run: |
          oversized=$(find . -path './.git' -prune -o -type f -size +90M -print)
          if [ -n "$oversized" ]; then
            echo "Generated repository contains file(s) above the 90 MiB safety ceiling:"
            echo "$oversized"
            exit 1
          fi
          if [ -f data/editorial_story_registry.json ]; then
            python - <<'PY'
          from pathlib import Path
          path = Path("data/editorial_story_registry.json")
          print(f"Editorial registry size before commit: {path.stat().st_size / (1024 * 1024):.2f} MiB")
          PY
          fi

      - name: Commit and push
        id: push
        run: |
          git config user.name "TCT Bot"
          git config user.email "bot@treasurecoast.today"
          git add -A
          git diff --staged --quiet || git commit -m "Update: $(date -u '+%b %d %Y %H:%M UTC')"
          git pull --rebase
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy attempt 1
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 1
        if: steps.d1.outcome == 'failure'
        run: sleep 45

      - name: Deploy attempt 2
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 2
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 90

      - name: Deploy attempt 3
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
