name: Update Treasure Coast Events

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10,22 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

# Share the publication lock with Generate News so the two workflows never race
# while committing or deploying the same static site.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    name: Refresh official events calendars
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      committed: ${{ steps.push.outputs.committed }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install event ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Refresh Treasure Coast events
        run: python -u scripts/update_events.py

      - name: Build event detail pages and lifecycle
        run: python -u scripts/build_audience_features.py --events-only

      - name: Validate event artifacts and lifecycle
        run: |
          python scripts/update_events.py --validate-only
          python scripts/build_audience_features.py --validate-events-only

      - name: Remove transient Python artifacts
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Commit changed event data
        id: push
        run: |
          git config user.name "TCT Events Bot"
          git config user.email "bot@treasurecoast.today"

          # Generated event caches should never be manually merged/rebased. A queued
          # workflow can start from an older trigger SHA, and main can also advance
          # while this job is fetching calendars. If push loses that race, rebuild
          # the event artifacts on the new main tip and try again.
          for attempt in 1 2 3; do
            git add events.html sitemap.xml data/events.json data/events-source-cache.json data/events-source-status.json data/events-retention.json
            git add -A events/
            if git diff --staged --quiet; then
              echo "No event changes to publish."
              echo "committed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Events: refresh $(date -u '+%b %d %Y %H:%M UTC')"
            if git push origin HEAD:main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Event publish could not catch up with main after 3 attempts." >&2
              exit 1
            fi

            echo "main advanced during event refresh; rebuilding on latest main (attempt $((attempt + 1))/3)."
            git fetch origin main
            git reset --hard origin/main
            python -u scripts/update_events.py
            python -u scripts/build_audience_features.py --events-only
            python scripts/update_events.py --validate-only
            python scripts/build_audience_features.py --validate-events-only
          done

  deploy:
    needs: update
    if: needs.update.outputs.committed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy attempt 1
        id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 1
        if: steps.d1.outcome == 'failure'
        run: sleep 45

      - name: Deploy attempt 2
        id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry 2
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 90

      - name: Deploy attempt 3
        id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
