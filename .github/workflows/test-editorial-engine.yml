name: Test Editorial Engine

on:
  workflow_dispatch:
  push:
    paths:
      - "tct_engine/**"
      - "tests/**"
      - ".github/workflows/test-editorial-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Verify editorial engine import
        run: |
          python -c "import tct_engine; print('tct_engine import successful')"

      - name: Run editorial engine tests
        run: |
          python -m pytest tests -v
