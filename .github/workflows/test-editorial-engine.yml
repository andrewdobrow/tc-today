name: Test Editorial Engine

on:
  workflow_dispatch:
  push:
    paths:
      - "tct_engine/**"
      - "tests/**"
      - "scripts/**"
      - "custom_articles.json"
      - "data/custom-retirements.json"
      - "data/generation-cache.json"
      - "manifest.json"
      - ".github/workflows/test-editorial-engine.yml"
      - ".github/workflows/update.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TCT_ARTICLE_BANNER_MODE: reader_support

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep this dependency set aligned with the production update workflow.
          # Publisher regression tests import scripts/generate.py and therefore
          # require the generator's runtime dependencies even though all network
          # and AI calls remain disabled during tests.
          python -m pip install feedparser anthropic requests json-repair pytest

      - name: Sanitize persistent generation cache
        run: python scripts/sanitize_generation_cache.py

      - name: Apply generator runtime hotfix
        run: python scripts/apply_generator_runtime_hotfix.py

      - name: Apply false-jurisdiction source guard
        run: python scripts/apply_false_jurisdiction_hotfix.py

      - name: Retire false-jurisdiction publication
        run: python scripts/repair_false_jurisdiction_publication.py

      - name: Normalize recent reader-support banners
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.generate import _migrate_legacy_article_support_banners

          result = _migrate_legacy_article_support_banners(Path.cwd(), limit=50)
          print(
              "Reader-support preflight: "
              f"{result['checked']} checked, {result['migrated']} migrated"
          )
          PY

      - name: Normalize persistent story registry
        run: python scripts/repair_editorial_story_registry.py

      - name: Validate editorial package
        run: python scripts/validate_package.py

      - name: Run editorial engine tests
        run: |
          python -m pytest tests -v \
            --ignore=tests/test_canonical_identity.py \
            --ignore=tests/test_matcher_contract.py
