name: Deploy TCT iOS Push Enrollment (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tct-ios-push-device-deploy
  cancel-in-progress: false

jobs:
  deploy-push-enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_CLI_VERSION: "2.117.0"
    steps:
      - uses: actions/checkout@v4
      - name: Check existing deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Missing SUPABASE_ACCESS_TOKEN secret'; exit 1; }
          test -n "$PROJECT_ID" || { echo '::error::Missing SUPABASE_PROJECT_REF variable'; exit 1; }
          test -f supabase/migrations/202610110001_ios_push_device_registry.sql || { echo '::error::Missing push SQL migration'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/tct-supabase-cli"
          mkdir -p "$cli_root"
          npm install --prefix "$cli_root" --no-save --no-package-lock --no-audit --no-fund "supabase@${SUPABASE_CLI_VERSION}"
          echo "$cli_root/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Deploy ONLY iOS push-device Edge Function
        run: supabase functions deploy push-device --use-api --project-ref "$PROJECT_ID"
