name: Deploy TCT iOS Push Sender (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tct-ios-push-sender-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_CLI_VERSION: "2.117.0"
    steps:
      - uses: actions/checkout@v4
      - name: Confirm deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$PROJECT_ID" || { echo '::error::Missing SUPABASE_PROJECT_REF'; exit 1; }
          test -f supabase/functions/push-dispatch/index.ts || { echo '::error::Missing sender'; exit 1; }
          grep -A2 '^\[functions.push-dispatch\]' supabase/config.toml | grep -q '^verify_jwt = false$' || { echo '::error::Missing sender configuration'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          cli_root="$RUNNER_TEMP/tct-supabase-cli"
          mkdir -p "$cli_root"
          npm install --prefix "$cli_root" --no-save --no-package-lock --no-audit --no-fund "supabase@${SUPABASE_CLI_VERSION}"
          echo "$cli_root/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Deploy ONLY push-dispatch
        shell: bash
        run: supabase functions deploy push-dispatch --use-api --project-ref "$PROJECT_ID"
