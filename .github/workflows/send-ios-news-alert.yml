name: TCT iOS News Alert (manual preview or send)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Diagnose APNs keys (no send), preview, or send (separately gated)"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - diagnose
          - send
      audience:
        description: "Reader preference group"
        required: true
        type: choice
        default: breaking
        options:
          - breaking
          - martin
          - st_lucie
          - indian_river
      slug:
        description: "Required for preview/send only: published article filename without .html"
        required: false
        type: string
      title:
        description: "Required for preview/send only: notification headline (100 characters max)"
        required: false
        type: string
      body:
        description: "Required for preview/send only: notification body (180 characters max)"
        required: false
        type: string
      confirm:
        description: "Only for send: type SEND (diagnose and preview ignore this)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tct-ios-manual-news-alerts
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_REF }}
      DISPATCH_KEY: ${{ secrets.TCT_PUSH_DISPATCH_KEY }}
      MODE: ${{ inputs.action }}
      AUDIENCE: ${{ inputs.audience }}
      SLUG: ${{ inputs.slug }}
      ALERT_TITLE: ${{ inputs.title }}
      ALERT_BODY: ${{ inputs.body }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Validate operator inputs and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" || { echo '::error::Missing SUPABASE_PROJECT_REF'; exit 1; }
          [[ "$DISPATCH_KEY" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::Missing valid TCT_PUSH_DISPATCH_KEY secret'; exit 1; }
          if [[ "$MODE" != "diagnose" ]]; then
            test -n "$SLUG" || { echo '::error::Published story slug required for preview/send'; exit 1; }
            test -n "$ALERT_TITLE" || { echo '::error::Notification title required for preview/send'; exit 1; }
            test -n "$ALERT_BODY" || { echo '::error::Notification body required for preview/send'; exit 1; }
          fi
          if [[ "$MODE" == "send" && "$CONFIRM" != "SEND" ]]; then
            echo '::error::To send, the confirmation input must equal SEND'
            exit 1
          fi
      - name: Diagnose credentials, preview, or request an approved alert
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -n --arg action "$MODE" --arg audience "$AUDIENCE" \
            --arg slug "$SLUG" --arg title "$ALERT_TITLE" --arg body "$ALERT_BODY" \
            --arg confirm "$CONFIRM" \
            '{action:$action,audience:$audience,slug:$slug,title:$title,body:$body,confirm:$confirm}')
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          http_status=$(curl --silent --show-error --max-time 150 --output "$response_file" \
            --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' \
            --header "x-tct-push-dispatch-key: $DISPATCH_KEY" \
            --data-raw "$payload" \
            "https://${PROJECT_ID}.supabase.co/functions/v1/push-dispatch")
          jq . "$response_file"
          if [[ "$http_status" != '200' ]]; then
            echo "::error::Push dispatcher returned HTTP $http_status; nothing should be retried blindly."
            exit 1
          fi
